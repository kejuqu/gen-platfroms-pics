name: Test, Build & Deploy

on:
  push:
    branches: [main]
  # 手动触发：Actions 页面点 "Run workflow"
  workflow_dispatch:

# 镜像标签 & 仓库地址集中定义，方便修改
# Docker Hub 为默认仓库，无需指定 registry
env:
  IMAGE: lekequ/device-mockup-studio

jobs:
  test:
    name: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: run tests
        run: pnpm test

  deploy:
    name: build & push into tenxunyun
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 用 commit sha 作为镜像 tag，可追溯、可回滚
      - name: get image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to the server and update the containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/app
            sed -i 's|image: .*|image: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}|' docker-compose.yml
            docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password ${{ secrets.DOCKERHUB_TOKEN }}
            docker compose pull
            docker compose up -d
            docker image prune -f
