name: Test, Build & Deploy

on:
  push:
    branches: [main]
  # 手动触发：Actions 页面点 "Run workflow"
  workflow_dispatch:

# 镜像标签 & 仓库地址集中定义，方便修改
# Docker Hub 为默认仓库，无需指定 registry
env:
  IMAGE: lekequ/device-mockup-studio

jobs:
  test:
    name: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          # pnpm 11 要求 Node ≥ 22.13
          node-version: 22
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: run tests
        run: pnpm test

  deploy:
    name: build & push into tenxunyun
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 用 commit sha 作为镜像 tag，可追溯、可回滚
      - name: get image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 每次部署都把 compose 文件同步到服务器，服务器端无需任何手动准备
      - name: Upload docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: /opt/app
          strip_components: 0

      - name: Log in to the server and update the containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/app
            sed -i 's|image: .*|image: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}|' docker-compose.yml
            # 注意：国内服务器不要在这里 docker login —— 加速器只管 pull，login 会直连 docker.io 超时
            # 镜像仓库保持 public，匿名 pull 经加速器即可
            docker compose pull
            docker compose up -d
            docker image prune -f
