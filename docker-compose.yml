# 由 GitHub Actions 自动上传到服务器的 /opt/app/ 并启动
# 镜像 tag 由 workflow 部署时自动改为具体的 commit 版本
services:
  app:
    image: <你的DockerHub用户名>/device-mockup-studio:latest
    container_name: device-mockup-studio
    restart: unless-stopped
    ports:
      # 只绑定本机回环地址，由 Nginx 反向代理对外提供 80/443
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
